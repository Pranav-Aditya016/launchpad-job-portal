<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CV</title>
<style>
  @page {
    size: A4;
    margin: 2.2cm 2.4cm;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "SF Pro", "Inter", system-ui, sans-serif;
    color: #1d1d1f;
    font-size: 11pt;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-size: 22pt;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.15em 0;
    color: #111;
  }

  h2 {
    font-size: 13pt;
    font-weight: 600;
    letter-spacing: -0.005em;
    margin: 1.6em 0 0.5em 0;
    padding-bottom: 0.25em;
    border-bottom: 1px solid #d2d2d7;
    color: #111;
  }

  h3 {
    font-size: 11.5pt;
    font-weight: 600;
    margin: 1em 0 0.25em 0;
    color: #1d1d1f;
  }

  p {
    margin: 0.4em 0;
  }

  strong {
    font-weight: 600;
  }

  em {
    color: #515154;
  }

  ul, ol {
    margin: 0.4em 0 0.8em 0;
    padding-left: 1.25em;
  }

  li {
    margin: 0.25em 0;
  }

  a {
    color: #06c;
    text-decoration: none;
  }

  hr {
    border: none;
    border-top: 1px solid #d2d2d7;
    margin: 1.2em 0;
  }

  code {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 0.9em;
    background: #f5f5f7;
    padding: 0.1em 0.35em;
    border-radius: 4px;
  }
</style>
</head>
<body>
{{ body }}
</body>
</html>
