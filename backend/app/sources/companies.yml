# ATS-backed company registry (Track B).
#
# Every entry below was hit live and verified to return real, currently-open
# postings at verification time (2026-08-26) — see .superpowers/track-b-report.md
# for the raw counts. This file intentionally does NOT include every company
# that was tried; a lot of plausible slugs 404 or return zero postings, and a
# registry full of dead entries is worse than a short one.
#
# Schema:
#   name:    display name, used to build Job.company and job_id()
#   ats:     greenhouse | lever | ashby | smartrecruiters | workable |
#            recruitee | personio | workday
#   slug:    the company's identifier on that ATS (case-sensitive for some
#            platforms — smartrecruiters and workday care about case)
#   regions: ISO-ish region tags for Job.region; first entry is primary
#   wd_host / site: workday only — tenant URLs vary per company, so both are
#            required explicitly rather than guessed

