# --- Workday (POST, tenant URLs vary — wd_host/site required) ----------
# IBM and SAP were explicitly requested but their Workday tenant/site could
# not be determined within the verification window (guesses returned 422
# "no such site"; both companies' public careers pages render entirely via
# client-side JS with no static reference to the API path). Accenture's
# tenant WAS found and verified live (2000 total postings at check time).
- {name: Accenture, ats: workday, slug: accenture, wd_host: wd103, site: AccentureCareers, regions: [global, in]}
