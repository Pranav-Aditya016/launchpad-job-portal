[project]
name = "launchpad-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27",
  "pydantic>=2.6", "python-multipart>=0.0.9",
  "anthropic>=0.39", "markitdown>=0.0.1a2", "weasyprint>=61",
  "crawl4ai>=0.4", "markdown>=3.6",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: opt-in tests that spawn Node and hit live network (RUN_INTEGRATION=1 to run)",
]
